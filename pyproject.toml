[project]
name = "tinymlinternship"
version = "0.1.0"
description = "SARDINE — tiny-hardware chess bot (Goal.md)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "pandas",
    "kagglehub",
    "python-chess>=1.0.0",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "flake8",
    "mypy",
]
data = [
    "pyarrow",
    "matplotlib",
    "openpyxl",
    "zstandard",
    "tqdm",
]
train = [
    "torch",
    "pyarrow",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tinymlinternship*"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --tb=short"
testpaths = ["tests"]
pythonpath = ["src"]
